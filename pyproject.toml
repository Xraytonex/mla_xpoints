[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mla-xpoints"
version = "0.1.0"
description = "Reader for FEI/Thermo MLA .xpoints raw X-ray spectra and their .jkf index"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mla-xpoints = "mla_xpoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the RODARE 4896 files under data/ (skipped if absent)"]
